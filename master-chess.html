<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Master Chess</title>
<style>
  :root{
    --bg1:#1b1f2a;
    --bg2:#12151d;
    --panel:#20263380;
    --panel-solid:#232a38;
    --gold:#d8b463;
    --gold-dim:#8a744a;
    --light-sq:#eddcc0;
    --dark-sq:#8a6a4b;
    --highlight:#f4d35e;
    --move-dot:#4caf5099;
    --capture-ring:#e35d5d;
    --check:#e35d5d;
    --text:#f2ede3;
    --text-dim:#b9b3a6;
    --accent:#c9a24b;
    --accent2:#7fb0a0;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:
      radial-gradient(1200px 700px at 15% -10%, #2a3346 0%, transparent 60%),
      radial-gradient(1000px 600px at 110% 10%, #33261f 0%, transparent 55%),
      linear-gradient(160deg, var(--bg1), var(--bg2));
    color:var(--text);
    font-family: 'Georgia', 'Times New Roman', serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .app{
    width:100%;
    max-width:1080px;
    display:flex;
    flex-direction:column;
    gap:16px;
  }
  header.top{
    text-align:center;
  }
  header.top h1{
    font-size:2.1rem;
    letter-spacing:3px;
    margin:0;
    background:linear-gradient(180deg,#f3dca0,var(--gold-dim));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    text-shadow:0 2px 10px rgba(0,0,0,0.4);
    font-weight:700;
  }
  header.top p{
    margin:4px 0 0;
    color:var(--text-dim);
    font-size:0.85rem;
    letter-spacing:1px;
    text-transform:uppercase;
  }
  .layout{
    display:flex;
    gap:20px;
    align-items:flex-start;
    flex-wrap:wrap;
    justify-content:center;
  }
  .board-wrap{
    position:relative;
    flex:0 0 auto;
  }
  .board-frame{
    background:linear-gradient(160deg,#3b2a1c,#241a11);
    border-radius:14px;
    padding:14px;
    box-shadow:0 20px 50px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(216,180,99,0.25);
  }
  .board{
    display:grid;
    grid-template-columns:repeat(8, min(9vw, 62px));
    grid-template-rows:repeat(8, min(9vw, 62px));
    border-radius:4px;
    overflow:hidden;
    box-shadow:0 0 0 3px #12151d, 0 0 0 4px rgba(216,180,99,0.35);
  }
  .sq{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:min(6.4vw, 42px);
    cursor:pointer;
    user-select:none;
    transition:filter 0.15s ease;
  }
  .sq.light{background:var(--light-sq);}
  .sq.dark{background:var(--dark-sq);}
  .sq .piece{
    z-index:3;
    filter:drop-shadow(0 2px 2px rgba(0,0,0,0.45));
    transition:transform 0.12s ease;
    pointer-events:none;
  }
  .sq.selected{box-shadow:inset 0 0 0 4px var(--highlight);}
  .sq.last-from{background:#c9b36b99;}
  .sq.last-to{background:#c9b36b99;}
  .sq.in-check{box-shadow:inset 0 0 0 4px var(--check);}
  .sq .dot{
    position:absolute;
    width:26%;
    height:26%;
    border-radius:50%;
    background:var(--move-dot);
    z-index:2;
  }
  .sq .ring{
    position:absolute;
    width:82%;
    height:82%;
    border-radius:50%;
    box-shadow:inset 0 0 0 4px var(--capture-ring);
    z-index:2;
  }
  .coords{
    position:absolute;
    bottom:2px;
    left:3px;
    font-size:9px;
    font-weight:700;
    z-index:4;
    pointer-events:none;
    opacity:0.55;
  }
  .sq.light .coords{color:#5a4630;}
  .sq.dark .coords{color:#e9dcc4;}

  .side-panel{
    flex:1 1 280px;
    min-width:260px;
    max-width:340px;
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .panel-card{
    background:var(--panel);
    backdrop-filter:blur(6px);
    border:1px solid rgba(216,180,99,0.18);
    border-radius:12px;
    padding:14px 16px;
  }
  .status-line{
    font-size:1.05rem;
    font-weight:700;
    color:var(--gold);
    text-align:center;
    min-height:1.4em;
  }
  .status-sub{
    text-align:center;
    color:var(--text-dim);
    font-size:0.8rem;
    margin-top:2px;
  }
  .mode-row{
    display:flex;
    gap:8px;
    margin-bottom:10px;
  }
  .mode-btn{
    flex:1;
    padding:8px 6px;
    border-radius:8px;
    border:1px solid rgba(216,180,99,0.3);
    background:rgba(0,0,0,0.2);
    color:var(--text);
    font-family:inherit;
    font-size:0.8rem;
    cursor:pointer;
    transition:all 0.15s;
  }
  .mode-btn.active{
    background:linear-gradient(180deg,#e8cd8f,#c9a24b);
    color:#241a11;
    font-weight:700;
    border-color:transparent;
  }
  .diff-row{
    display:flex;
    gap:6px;
    margin-top:6px;
  }
  .diff-btn{
    flex:1;
    padding:6px 4px;
    border-radius:6px;
    border:1px solid rgba(216,180,99,0.25);
    background:rgba(0,0,0,0.15);
    color:var(--text-dim);
    font-family:inherit;
    font-size:0.72rem;
    cursor:pointer;
  }
  .diff-btn.active{
    background:rgba(127,176,160,0.25);
    color:var(--accent2);
    border-color:var(--accent2);
    font-weight:700;
  }
  .btn-row{
    display:flex;
    gap:8px;
    margin-top:10px;
  }
  .action-btn{
    flex:1;
    padding:9px 8px;
    border-radius:8px;
    border:none;
    background:rgba(216,180,99,0.15);
    color:var(--gold);
    font-family:inherit;
    font-weight:700;
    font-size:0.82rem;
    cursor:pointer;
    border:1px solid rgba(216,180,99,0.3);
    transition:all 0.15s;
  }
  .action-btn:hover{background:rgba(216,180,99,0.28);}
  .captured{
    display:flex;
    flex-wrap:wrap;
    gap:2px;
    min-height:26px;
    font-size:1.3rem;
    line-height:1;
  }
  .cap-label{
    font-size:0.72rem;
    text-transform:uppercase;
    letter-spacing:1px;
    color:var(--text-dim);
    margin-bottom:4px;
  }
  .history{
    max-height:150px;
    overflow-y:auto;
    font-size:0.85rem;
    color:var(--text-dim);
    line-height:1.6;
    padding-right:4px;
  }
  .history::-webkit-scrollbar{width:6px;}
  .history::-webkit-scrollbar-thumb{background:rgba(216,180,99,0.3);border-radius:3px;}
  .history .mv-pair{display:flex;gap:8px;}
  .history .mv-num{color:var(--gold-dim);width:24px;flex-shrink:0;}
  .promo-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.55);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:50;
  }
  .promo-box{
    background:#241a11;
    border:1px solid rgba(216,180,99,0.4);
    border-radius:12px;
    padding:16px;
    display:flex;
    gap:10px;
  }
  .promo-choice{
    font-size:2.2rem;
    width:56px;
    height:56px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--light-sq);
    border-radius:8px;
    cursor:pointer;
    border:2px solid transparent;
  }
  .promo-choice:hover{border-color:var(--highlight);}
  .end-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.6);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:60;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.25s;
  }
  .end-overlay.show{opacity:1;pointer-events:auto;}
  .end-box{
    background:linear-gradient(160deg,#2c2013,#1c140c);
    border:1px solid rgba(216,180,99,0.4);
    border-radius:16px;
    padding:28px 32px;
    text-align:center;
    max-width:320px;
    box-shadow:0 20px 60px rgba(0,0,0,0.6);
  }
  .end-box h2{
    margin:0 0 8px;
    color:var(--gold);
    font-size:1.5rem;
  }
  .end-box p{color:var(--text-dim);margin:0 0 16px;font-size:0.9rem;}
  .footer-note{
    text-align:center;
    color:var(--text-dim);
    font-size:0.72rem;
    opacity:0.6;
    margin-top:4px;
  }
  @media (max-width:640px){
    header.top h1{font-size:1.5rem;letter-spacing:1.5px;}
    .side-panel{max-width:100%;}
  }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>♚ Master Chess</h1>
    <p>Play vs Computer or Local Two Player</p>
  </header>

  <div class="layout">
    <div class="board-wrap">
      <div class="board-frame">
        <div class="board" id="board"></div>
      </div>
    </div>

    <div class="side-panel">
      <div class="panel-card">
        <div class="status-line" id="statusLine">White to move</div>
        <div class="status-sub" id="statusSub">&nbsp;</div>
      </div>

      <div class="panel-card">
        <div class="mode-row">
          <button class="mode-btn active" id="modeAI">Vs Computer</button>
          <button class="mode-btn" id="modeLocal">2 Player</button>
        </div>
        <div class="diff-row" id="diffRow">
          <button class="diff-btn" data-d="1">Easy</button>
          <button class="diff-btn active" data-d="2">Medium</button>
          <button class="diff-btn" data-d="3">Hard</button>
        </div>
        <div class="btn-row">
          <button class="action-btn" id="undoBtn">Undo</button>
          <button class="action-btn" id="restartBtn">New Game</button>
        </div>
      </div>

      <div class="panel-card">
        <div class="cap-label">White captured</div>
        <div class="captured" id="capByWhite"></div>
        <div class="cap-label" style="margin-top:10px;">Black captured</div>
        <div class="captured" id="capByBlack"></div>
      </div>

      <div class="panel-card">
        <div class="cap-label">Moves</div>
        <div class="history" id="history"></div>
      </div>
    </div>
  </div>
  <div class="footer-note">Full rules: castling, en passant, promotion, check &amp; checkmate detection.</div>
</div>

<div class="promo-overlay" id="promoOverlay" style="display:none;">
  <div class="promo-box" id="promoBox"></div>
</div>

<div class="end-overlay" id="endOverlay">
  <div class="end-box">
    <h2 id="endTitle">Checkmate</h2>
    <p id="endSub">White wins</p>
    <button class="action-btn" id="endRestart" style="width:100%;">Play Again</button>
  </div>
</div>

<script>
(function(){
  "use strict";

  const PIECES_UNI = {
    wK:"♔",wQ:"♕",wR:"♖",wB:"♗",wN:"♘",wP:"♙",
    bK:"♚",bQ:"♛",bR:"♜",bB:"♝",bN:"♞",bP:"♟"
  };
  const VALUES = {P:100,N:320,B:330,R:500,Q:900,K:20000};

  function initialBoard(){
    const b = Array.from({length:8},()=>Array(8).fill(null));
    const back = ["R","N","B","Q","K","B","N","R"];
    for(let c=0;c<8;c++){
      b[0][c] = "b"+back[c];
      b[1][c] = "bP";
      b[6][c] = "wP";
      b[7][c] = "w"+back[c];
    }
    return b;
  }

  function cloneBoard(b){
    return b.map(row=>row.slice());
  }

  function inBounds(r,c){ return r>=0 && r<8 && c>=0 && c<8; }

  function colorOf(p){ return p ? p[0] : null; }
  function typeOf(p){ return p ? p[1] : null; }
  function opponent(color){ return color === 'w' ? 'b' : 'w'; }

  // Game state
  let state = {
    board: initialBoard(),
    turn: 'w',
    castling: {wK:true, wQ:true, bK:true, bQ:true},
    enPassant: null, // {r,c} square that can be captured onto
    history: [],       // list of SAN-ish strings paired
    moveLog: [],        // full move objects for undo
    kingPos: {w:[7,4], b:[0,4]},
    capturedByWhite: [], // pieces white has captured (black pieces)
    capturedByBlack: [],
    gameOver: false,
    mode: 'ai', // 'ai' or 'local'
    aiDepth: 2,
    aiColor: 'b'
  };

  let selected = null; // {r,c}
  let legalMovesForSelected = [];
  let lastMove = null; // {from:{r,c}, to:{r,c}}

  // ---------- Move generation ----------

  function getPseudoMoves(board, r, c, castlingRights, enPassant){
    const p = board[r][c];
    if(!p) return [];
    const color = colorOf(p);
    const type = typeOf(p);
    const moves = [];

    const addIfOk = (nr,nc,captureOnly,noCaptureOnly)=>{
      if(!inBounds(nr,nc)) return false;
      const target = board[nr][nc];
      if(target === null){
        if(!captureOnly) moves.push({r:nr,c:nc});
        return true; // empty, can continue sliding
      } else {
        if(colorOf(target) !== color && !noCaptureOnly){
          moves.push({r:nr,c:nc, capture:true});
        }
        return false; // blocked
      }
    };

    if(type === 'P'){
      const dir = color === 'w' ? -1 : 1;
      const startRow = color === 'w' ? 6 : 1;
      const promoRow = color === 'w' ? 0 : 7;
      // forward 1
      if(inBounds(r+dir,c) && board[r+dir][c] === null){
        moves.push({r:r+dir, c:c, promo: (r+dir===promoRow)});
        // forward 2
        if(r === startRow && board[r+2*dir][c] === null){
          moves.push({r:r+2*dir, c:c, doubleStep:true});
        }
      }
      // captures
      for(const dc of [-1,1]){
        const nr=r+dir, nc=c+dc;
        if(!inBounds(nr,nc)) continue;
        const target = board[nr][nc];
        if(target && colorOf(target) !== color){
          moves.push({r:nr,c:nc,capture:true, promo:(nr===promoRow)});
        } else if(enPassant && enPassant.r === nr && enPassant.c === nc){
          moves.push({r:nr,c:nc,capture:true, enPassant:true});
        }
      }
    }
    else if(type === 'N'){
      const deltas = [[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]];
      for(const [dr,dc] of deltas){
        const nr=r+dr, nc=c+dc;
        if(!inBounds(nr,nc)) continue;
        const target = board[nr][nc];
        if(!target || colorOf(target) !== color){
          moves.push({r:nr,c:nc,capture: !!target});
        }
      }
    }
    else if(type === 'B' || type === 'R' || type === 'Q'){
      let dirs = [];
      if(type === 'B' || type === 'Q') dirs = dirs.concat([[-1,-1],[-1,1],[1,-1],[1,1]]);
      if(type === 'R' || type === 'Q') dirs = dirs.concat([[-1,0],[1,0],[0,-1],[0,1]]);
      for(const [dr,dc] of dirs){
        let nr=r+dr, nc=c+dc;
        while(inBounds(nr,nc)){
          const target = board[nr][nc];
          if(!target){
            moves.push({r:nr,c:nc});
          } else {
            if(colorOf(target) !== color) moves.push({r:nr,c:nc,capture:true});
            break;
          }
          nr+=dr; nc+=dc;
        }
      }
    }
    else if(type === 'K'){
      for(let dr=-1;dr<=1;dr++){
        for(let dc=-1;dc<=1;dc++){
          if(dr===0 && dc===0) continue;
          const nr=r+dr, nc=c+dc;
          if(!inBounds(nr,nc)) continue;
          const target = board[nr][nc];
          if(!target || colorOf(target) !== color){
            moves.push({r:nr,c:nc,capture: !!target});
          }
        }
      }
      // castling
      if(castlingRights){
        const row = color === 'w' ? 7 : 0;
        if(r === row && c === 4){
          const kSideRight = color==='w'? castlingRights.wK : castlingRights.bK;
          const qSideRight = color==='w'? castlingRights.wQ : castlingRights.bQ;
          if(kSideRight && board[row][5]===null && board[row][6]===null && board[row][7]===(color+'R')){
            moves.push({r:row,c:6,castle:'K'});
          }
          if(qSideRight && board[row][3]===null && board[row][2]===null && board[row][1]===null && board[row][0]===(color+'R')){
            moves.push({r:row,c:2,castle:'Q'});
          }
        }
      }
    }
    return moves;
  }

  function isSquareAttacked(board, r, c, byColor){
    // Check pawn attacks
    const pawnDir = byColor === 'w' ? 1 : -1; // pawn attacks come from row+pawnDir relative to target (a white pawn attacks upward, so check row+1)
    for(const dc of [-1,1]){
      const rr = r + pawnDir, cc = c + dc;
      if(inBounds(rr,cc)){
        const p = board[rr][cc];
        if(p && colorOf(p)===byColor && typeOf(p)==='P') return true;
      }
    }
    // Knight
    const knightDeltas = [[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]];
    for(const [dr,dc] of knightDeltas){
      const rr=r+dr, cc=c+dc;
      if(inBounds(rr,cc)){
        const p = board[rr][cc];
        if(p && colorOf(p)===byColor && typeOf(p)==='N') return true;
      }
    }
    // King
    for(let dr=-1;dr<=1;dr++){
      for(let dc=-1;dc<=1;dc++){
        if(dr===0&&dc===0) continue;
        const rr=r+dr, cc=c+dc;
        if(inBounds(rr,cc)){
          const p = board[rr][cc];
          if(p && colorOf(p)===byColor && typeOf(p)==='K') return true;
        }
      }
    }
    // Sliding: bishop/queen diag
    const diagDirs = [[-1,-1],[-1,1],[1,-1],[1,1]];
    for(const [dr,dc] of diagDirs){
      let rr=r+dr, cc=c+dc;
      while(inBounds(rr,cc)){
        const p = board[rr][cc];
        if(p){
          if(colorOf(p)===byColor && (typeOf(p)==='B'||typeOf(p)==='Q')) return true;
          break;
        }
        rr+=dr; cc+=dc;
      }
    }
    // Sliding: rook/queen straight
    const straightDirs = [[-1,0],[1,0],[0,-1],[0,1]];
    for(const [dr,dc] of straightDirs){
      let rr=r+dr, cc=c+dc;
      while(inBounds(rr,cc)){
        const p = board[rr][cc];
        if(p){
          if(colorOf(p)===byColor && (typeOf(p)==='R'||typeOf(p)==='Q')) return true;
          break;
        }
        rr+=dr; cc+=dc;
      }
    }
    return false;
  }

  function findKing(board, color){
    for(let r=0;r<8;r++) for(let c=0;c<8;c++){
      const p = board[r][c];
      if(p && colorOf(p)===color && typeOf(p)==='K') return {r,c};
    }
    return null;
  }

  function applyMoveToBoard(board, from, to, move, castlingRights, enPassant){
    // returns new board, new castlingRights, new enPassant, capturedPiece, info
    const nb = cloneBoard(board);
    const piece = nb[from.r][from.c];
    const color = colorOf(piece);
    const type = typeOf(piece);
    let captured = null;
    let newCastling = Object.assign({}, castlingRights);
    let newEnPassant = null;

    if(move.enPassant){
      // capture the pawn behind the target square
      const capRow = color === 'w' ? to.r+1 : to.r-1;
      captured = nb[capRow][to.c];
      nb[capRow][to.c] = null;
    } else if(nb[to.r][to.c]){
      captured = nb[to.r][to.c];
    }

    nb[to.r][to.c] = piece;
    nb[from.r][from.c] = null;

    // promotion
    if(move.promo){
      nb[to.r][to.c] = color + (move.promoteTo || 'Q');
    }

    // castling: move rook too
    if(move.castle === 'K'){
      const row = from.r;
      nb[row][5] = nb[row][7];
      nb[row][7] = null;
    } else if(move.castle === 'Q'){
      const row = from.r;
      nb[row][3] = nb[row][0];
      nb[row][0] = null;
    }

    // update castling rights
    if(type === 'K'){
      if(color==='w'){ newCastling.wK=false; newCastling.wQ=false; }
      else { newCastling.bK=false; newCastling.bQ=false; }
    }
    if(type === 'R'){
      if(color==='w' && from.r===7 && from.c===0) newCastling.wQ=false;
      if(color==='w' && from.r===7 && from.c===7) newCastling.wK=false;
      if(color==='b' && from.r===0 && from.c===0) newCastling.bQ=false;
      if(color==='b' && from.r===0 && from.c===7) newCastling.bK=false;
    }
    // if a rook gets captured on its home square
    if(to.r===7 && to.c===0) newCastling.wQ=false;
    if(to.r===7 && to.c===7) newCastling.wK=false;
    if(to.r===0 && to.c===0) newCastling.bQ=false;
    if(to.r===0 && to.c===7) newCastling.bK=false;

    // en passant target
    if(type === 'P' && move.doubleStep){
      const midRow = (from.r + to.r)/2;
      newEnPassant = {r:midRow, c:from.c};
    }

    return {board:nb, castling:newCastling, enPassant:newEnPassant, captured, color, type};
  }

  function getLegalMoves(board, r, c, castlingRights, enPassant){
    const p = board[r][c];
    if(!p) return [];
    const color = colorOf(p);
    const pseudo = getPseudoMoves(board, r, c, castlingRights, enPassant);
    const legal = [];
    for(const mv of pseudo){
      if(mv.castle){
        // king cannot be in check, cannot pass through attacked square, cannot land in check
        const row = r;
        if(isSquareAttacked(board, row, 4, opponent(color))) continue;
        const passCol = mv.castle === 'K' ? 5 : 3;
        if(isSquareAttacked(board, row, passCol, opponent(color))) continue;
        const result = applyMoveToBoard(board, {r,c}, {r:mv.r,c:mv.c}, mv, castlingRights, enPassant);
        if(isSquareAttacked(result.board, mv.r, mv.c, opponent(color))) continue;
        legal.push(mv);
        continue;
      }
      const result = applyMoveToBoard(board, {r,c}, {r:mv.r,c:mv.c}, mv, castlingRights, enPassant);
      const kingPos = (typeOf(p)==='K') ? {r:mv.r,c:mv.c} : findKing(result.board, color);
      if(!isSquareAttacked(result.board, kingPos.r, kingPos.c, opponent(color))){
        legal.push(mv);
      }
    }
    return legal;
  }

  function getAllLegalMoves(board, color, castlingRights, enPassant){
    const all = [];
    for(let r=0;r<8;r++){
      for(let c=0;c<8;c++){
        const p = board[r][c];
        if(p && colorOf(p)===color){
          const mvs = getLegalMoves(board, r, c, castlingRights, enPassant);
          for(const m of mvs) all.push({from:{r,c}, to:{r:m.r,c:m.c}, meta:m});
        }
      }
    }
    return all;
  }

  function isKingInCheck(board, color){
    const k = findKing(board, color);
    if(!k) return false;
    return isSquareAttacked(board, k.r, k.c, opponent(color));
  }

  // ---------- AI ----------

  function evaluateBoard(board){
    let score = 0;
    for(let r=0;r<8;r++){
      for(let c=0;c<8;c++){
        const p = board[r][c];
        if(!p) continue;
        const val = VALUES[typeOf(p)] || 0;
        // slight positional bonus: center control for minor pieces/pawns
        let posBonus = 0;
        if(typeOf(p)==='P' || typeOf(p)==='N' || typeOf(p)==='B'){
          const centerDist = Math.abs(3.5-r)+Math.abs(3.5-c);
          posBonus = (7-centerDist)*2;
        }
        const total = val + posBonus;
        score += colorOf(p)==='w' ? total : -total;
      }
    }
    return score;
  }

  function minimax(board, depth, alpha, beta, maximizing, castlingRights, enPassant){
    const color = maximizing ? 'w' : 'b';
    if(depth === 0){
      return {score: evaluateBoard(board)};
    }
    const moves = getAllLegalMoves(board, color, castlingRights, enPassant);
    if(moves.length === 0){
      if(isKingInCheck(board, color)){
        return {score: maximizing ? -100000 - depth : 100000 + depth};
      }
      return {score:0}; // stalemate
    }
    let best = maximizing ? -Infinity : Infinity;
    let bestMove = null;
    // shuffle for variety among equal moves
    const shuffled = moves.map(m=>[Math.random(),m]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
    for(const mv of shuffled){
      const result = applyMoveToBoard(board, mv.from, mv.to, mv.meta, castlingRights, enPassant);
      const evalResult = minimax(result.board, depth-1, alpha, beta, !maximizing, result.castling, result.enPassant);
      const s = evalResult.score;
      if(maximizing){
        if(s > best){ best = s; bestMove = mv; }
        alpha = Math.max(alpha, best);
      } else {
        if(s < best){ best = s; bestMove = mv; }
        beta = Math.min(beta, best);
      }
      if(beta <= alpha) break;
    }
    return {score: best, move: bestMove};
  }

  function aiMove(){
    const depth = state.aiDepth;
    const maximizing = state.aiColor === 'w';
    const result = minimax(state.board, depth, -Infinity, Infinity, maximizing, state.castling, state.enPassant);
    if(result.move){
      performMove(result.move.from, result.move.to, result.move.meta);
    }
  }

  // ---------- Rendering ----------

  const boardEl = document.getElementById('board');
  const statusLine = document.getElementById('statusLine');
  const statusSub = document.getElementById('statusSub');
  const historyEl = document.getElementById('history');
  const capWhiteEl = document.getElementById('capByWhite');
  const capBlackEl = document.getElementById('capByBlack');
  const promoOverlay = document.getElementById('promoOverlay');
  const promoBox = document.getElementById('promoBox');
  const endOverlay = document.getElementById('endOverlay');
  const endTitle = document.getElementById('endTitle');
  const endSub = document.getElementById('endSub');

  function squareId(r,c){ return r+'_'+c; }

  function buildBoardDOM(){
    boardEl.innerHTML = '';
    for(let r=0;r<8;r++){
      for(let c=0;c<8;c++){
        const sq = document.createElement('div');
        sq.className = 'sq ' + (((r+c)%2===0) ? 'light':'dark');
        sq.dataset.r = r;
        sq.dataset.c = c;
        sq.id = 'sq_'+squareId(r,c);
        if(c===0){
          const lab = document.createElement('div');
          lab.className='coords';
          lab.textContent = 8-r;
          sq.appendChild(lab);
        }
        sq.addEventListener('click', onSquareClick);
        boardEl.appendChild(sq);
      }
    }
  }

  function render(){
    // clear
    for(let r=0;r<8;r++){
      for(let c=0;c<8;c++){
        const sq = document.getElementById('sq_'+squareId(r,c));
        sq.classList.remove('selected','last-from','last-to','in-check');
        const existingPiece = sq.querySelector('.piece');
        if(existingPiece) existingPiece.remove();
        const dots = sq.querySelectorAll('.dot,.ring');
        dots.forEach(d=>d.remove());
        const p = state.board[r][c];
        if(p){
          const span = document.createElement('span');
          span.className='piece';
          span.textContent = PIECES_UNI[p];
          span.style.color = colorOf(p)==='w' ? '#fdfdfd' : '#1a1a1a';
          sq.appendChild(span);
        }
      }
    }
    if(selected){
      document.getElementById('sq_'+squareId(selected.r,selected.c)).classList.add('selected');
      for(const mv of legalMovesForSelected){
        const sq = document.getElementById('sq_'+squareId(mv.r,mv.c));
        const mark = document.createElement('div');
        mark.className = mv.capture ? 'ring' : 'dot';
        sq.appendChild(mark);
      }
    }
    if(lastMove){
      document.getElementById('sq_'+squareId(lastMove.from.r,lastMove.from.c)).classList.add('last-from');
      document.getElementById('sq_'+squareId(lastMove.to.r,lastMove.to.c)).classList.add('last-to');
    }
    // check highlight
    for(const col of ['w','b']){
      if(isKingInCheck(state.board, col)){
        const k = findKing(state.board, col);
        if(k) document.getElementById('sq_'+squareId(k.r,k.c)).classList.add('in-check');
      }
    }

    renderCaptured();
    renderHistory();
    renderStatus();
  }

  function pieceLetter(type){
    if(type==='P') return '';
    return type;
  }
  const files = 'abcdefgh';
  function squareName(r,c){ return files[c] + (8-r); }

  function renderHistory(){
    historyEl.innerHTML='';
    for(let i=0;i<state.history.length;i+=2){
      const div = document.createElement('div');
      div.className='mv-pair';
      const num = document.createElement('span');
      num.className='mv-num';
      num.textContent = (i/2+1)+'.';
      div.appendChild(num);
      const w = document.createElement('span');
      w.style.minWidth='58px';
      w.textContent = state.history[i] || '';
      div.appendChild(w);
      const b = document.createElement('span');
      b.textContent = state.history[i+1] || '';
      div.appendChild(b);
      historyEl.appendChild(div);
    }
    historyEl.scrollTop = historyEl.scrollHeight;
  }

  function renderCaptured(){
    capWhiteEl.innerHTML = state.capturedByWhite.map(p=>PIECES_UNI[p]).join(' ');
    capBlackEl.innerHTML = state.capturedByBlack.map(p=>PIECES_UNI[p]).join(' ');
  }

  function renderStatus(){
    if(state.gameOver) return;
    const turnName = state.turn==='w' ? 'White' : 'Black';
    const inCheck = isKingInCheck(state.board, state.turn);
    statusLine.textContent = turnName + ' to move' + (inCheck ? ' — Check!' : '');
    if(state.mode==='ai'){
      statusSub.textContent = state.turn === state.aiColor ? 'Computer thinking…' : 'Your move';
    } else {
      statusSub.textContent = 'Local two player';
    }
  }

  // ---------- Interaction ----------

  function onSquareClick(e){
    if(state.gameOver) return;
    if(state.mode === 'ai' && state.turn === state.aiColor) return; // block input during AI turn
    const r = parseInt(e.currentTarget.dataset.r);
    const c = parseInt(e.currentTarget.dataset.c);
    const p = state.board[r][c];

    if(selected){
      const mv = legalMovesForSelected.find(m=>m.r===r && m.c===c);
      if(mv){
        const from = {r:selected.r,c:selected.c};
        const to = {r,c};
        selected = null;
        legalMovesForSelected = [];
        if(mv.promo){
          showPromotionChoice(from, to, mv);
        } else {
          performMove(from, to, mv);
        }
        return;
      }
      // clicking another own piece re-selects
      if(p && colorOf(p) === state.turn){
        selected = {r,c};
        legalMovesForSelected = getLegalMoves(state.board, r, c, state.castling, state.enPassant);
      } else {
        selected = null;
        legalMovesForSelected = [];
      }
      render();
      return;
    }

    if(p && colorOf(p) === state.turn){
      selected = {r,c};
      legalMovesForSelected = getLegalMoves(state.board, r, c, state.castling, state.enPassant);
      render();
    }
  }

  function showPromotionChoice(from, to, mv){
    promoOverlay.style.display='flex';
    promoBox.innerHTML='';
    const color = colorOf(state.board[from.r][from.c]);
    const options = ['Q','R','B','N'];
    for(const opt of options){
      const div = document.createElement('div');
      div.className='promo-choice';
      div.textContent = PIECES_UNI[color+opt];
      div.style.color = color==='w' ? '#241a11' : '#1a1a1a';
      div.addEventListener('click', ()=>{
        promoOverlay.style.display='none';
        const mv2 = Object.assign({}, mv, {promoteTo: opt});
        performMove(from, to, mv2);
      });
      promoBox.appendChild(div);
    }
  }

  function moveToSAN(board, from, to, meta, pieceType, captured){
    if(meta.castle === 'K') return 'O-O';
    if(meta.castle === 'Q') return 'O-O-O';
    let s = '';
    if(pieceType !== 'P'){
      s += pieceType;
    }
    if(captured || meta.enPassant){
      if(pieceType === 'P') s += files[from.c];
      s += 'x';
    }
    s += squareName(to.r, to.c);
    if(meta.promo){
      s += '=' + (meta.promoteTo || 'Q');
    }
    return s;
  }

  function performMove(from, to, meta){
    const movingPiece = state.board[from.r][from.c];
    const pieceType = typeOf(movingPiece);
    const result = applyMoveToBoard(state.board, from, to, meta, state.castling, state.enPassant);

    const san = moveToSAN(state.board, from, to, meta, pieceType, result.captured);

    state.board = result.board;
    state.castling = result.castling;
    state.enPassant = result.enPassant;

    if(result.captured){
      if(colorOf(result.captured) === 'b'){
        state.capturedByWhite.push(result.captured);
      } else {
        state.capturedByBlack.push(result.captured);
      }
    }

    lastMove = {from, to};
    state.turn = opponent(state.turn);

    // check/checkmate suffix
    let sanFinal = san;
    const oppColor = state.turn;
    const inCheckNow = isKingInCheck(state.board, oppColor);
    const oppMoves = getAllLegalMoves(state.board, oppColor, state.castling, state.enPassant);
    let gameEnded = false;
    let endReason = null;
    if(oppMoves.length === 0){
      if(inCheckNow){
        sanFinal += '#';
        gameEnded = true;
        endReason = 'checkmate';
      } else {
        sanFinal += '';
        gameEnded = true;
        endReason = 'stalemate';
      }
    } else if(inCheckNow){
      sanFinal += '+';
    }

    state.history.push(sanFinal);

    render();

    if(gameEnded){
      finishGame(endReason, oppColor);
      return;
    }

    if(state.mode === 'ai' && state.turn === state.aiColor && !state.gameOver){
      setTimeout(aiMove, 350);
    }
  }

  function finishGame(reason, sideToMoveColorThatIsStuck){
    state.gameOver = true;
    if(reason === 'checkmate'){
      const winner = sideToMoveColorThatIsStuck === 'w' ? 'Black' : 'White';
      endTitle.textContent = 'Checkmate';
      endSub.textContent = winner + ' wins!';
      statusLine.textContent = 'Checkmate — ' + winner + ' wins!';
      statusSub.textContent = '';
    } else {
      endTitle.textContent = 'Stalemate';
      endSub.textContent = 'The game is a draw.';
      statusLine.textContent = 'Stalemate — Draw';
      statusSub.textContent = '';
    }
    endOverlay.classList.add('show');
  }

  // ---------- Undo / Restart ----------

  const undoStack = [];

  function snapshotState(){
    return {
      board: cloneBoard(state.board),
      turn: state.turn,
      castling: Object.assign({}, state.castling),
      enPassant: state.enPassant ? Object.assign({}, state.enPassant) : null,
      history: state.history.slice(),
      capturedByWhite: state.capturedByWhite.slice(),
      capturedByBlack: state.capturedByBlack.slice(),
      gameOver: state.gameOver
    };
  }

  const origPerformMove = performMove;
  // wrap performMove to push undo snapshots
  function performMoveWrapped(from, to, meta){
    undoStack.push(snapshotState());
    origPerformMove(from, to, meta);
  }

  function undo(){
    if(undoStack.length === 0) return;
    // if vs AI, undo twice to get back to player's turn (undo AI move + player move)
    let steps = 1;
    if(state.mode === 'ai' && undoStack.length >= 2 && state.turn === state.aiColor){
      steps = 1;
    } else if(state.mode==='ai' && undoStack.length>=2){
      steps = 2;
    }
    let snap = null;
    for(let i=0;i<steps && undoStack.length>0;i++){
      snap = undoStack.pop();
    }
    if(!snap) return;
    state.board = snap.board;
    state.turn = snap.turn;
    state.castling = snap.castling;
    state.enPassant = snap.enPassant;
    state.history = snap.history;
    state.capturedByWhite = snap.capturedByWhite;
    state.capturedByBlack = snap.capturedByBlack;
    state.gameOver = snap.gameOver;
    selected = null;
    legalMovesForSelected = [];
    lastMove = null;
    endOverlay.classList.remove('show');
    render();
  }

  function restart(){
    state.board = initialBoard();
    state.turn = 'w';
    state.castling = {wK:true,wQ:true,bK:true,bQ:true};
    state.enPassant = null;
    state.history = [];
    state.capturedByWhite = [];
    state.capturedByBlack = [];
    state.gameOver = false;
    selected = null;
    legalMovesForSelected = [];
    lastMove = null;
    undoStack.length = 0;
    endOverlay.classList.remove('show');
    render();
    if(state.mode==='ai' && state.turn===state.aiColor){
      setTimeout(aiMove, 350);
    }
  }

  // ---------- UI wiring ----------

  document.getElementById('modeAI').addEventListener('click', ()=>{
    state.mode = 'ai';
    document.getElementById('modeAI').classList.add('active');
    document.getElementById('modeLocal').classList.remove('active');
    document.getElementById('diffRow').style.display='flex';
    restart();
  });
  document.getElementById('modeLocal').addEventListener('click', ()=>{
    state.mode = 'local';
    document.getElementById('modeLocal').classList.add('active');
    document.getElementById('modeAI').classList.remove('active');
    document.getElementById('diffRow').style.display='none';
    restart();
  });
  document.querySelectorAll('.diff-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.diff-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      state.aiDepth = parseInt(btn.dataset.d) + 1; // 2,3,4
    });
  });
  document.getElementById('undoBtn').addEventListener('click', undo);
  document.getElementById('restartBtn').addEventListener('click', restart);
  document.getElementById('endRestart').addEventListener('click', restart);

  // override performMove reference used inside closures
  function performMoveProxy(from,to,meta){ performMoveWrapped(from,to,meta); }
  // Replace calls: since performMove is referenced inside onSquareClick/showPromotionChoice via closure name,
  // we redefine the name in this scope using var hoisting trick:
  // (JS allows function declarations to be reassigned)
  performMove = performMoveWrapped;

  // ---------- init ----------
  buildBoardDOM();
  render();

})();
</script>
</body>
</html>
